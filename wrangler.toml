name = "cf-do-locator"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"

# KV namespace holding the colo snapshot blob.
#
# First-deploy flow:
#   1. mise run kv:create          → wrangler prints the new namespace id
#   2. paste that id into `id` below (and commit — KV ids aren't secrets)
#   3. mise run kv:create:preview  → prints the preview id
#   4. paste into `preview_id` below
#   5. mise run worker:deploy
[[kv_namespaces]]
binding = "DO_LOCATOR_KV"
id = "9f0040f9777345979259197ea55274b8"
preview_id = "ee1c6129d3f54e1198aa0ab5b345fef4"

[vars]
# KV key under which the snapshot JSON lives. Override per env if you
# want a dev snapshot beside prod.
SNAPSHOT_KEY = "snapshot"

# Weekly refresh. Mondays 03:00 UTC.
[triggers]
crons = ["0 3 * * 1"]

[observability]
enabled = true
head_sampling_rate = 1.0
