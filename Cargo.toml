[package]
name = "cf-do-locator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Joe Blew <gedw99@gmail.com>"]
description = "Cloudflare colo → Durable Objects locationHint lookup service (ConnectRPC on Workers, KV-backed)"
license = "MIT"
repository = "https://github.com/joeblew999/cf-do-locator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Workers runtime. Same major as connectrpc-cedar to compose cleanly.
worker        = { version = "0.8", features = ["http"] }
worker-macros = { version = "0.8", features = ["http"] }

# ConnectRPC + protobuf runtime. Pinned to match connectrpc-cedar so
# downstream consumers can vendor both without version conflict.
connectrpc  = { version = "0.4", default-features = false }
buffa       = { version = "0.5", features = ["json"] }
buffa-types = { version = "0.5", features = ["json"] }

# Async middleware.
tower = { version = "0.5", default-features = false, features = ["util"] }

# HTTP plumbing.
http           = "1"
http-body      = "1"
http-body-util = "0.1"
bytes          = "1.5"

# JSON parsing for upstream data + KV blob serialization.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Async primitives used by tower::Service futures.
futures = "0.3"

# Tracing (logs go to Workers console via the worker crate's adapter).
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

# OS RNG on wasm32 — used transitively if any dep wants entropy.
getrandom = { version = "0.2", features = ["js"] }

[build-dependencies]
connectrpc-build = { version = "0.4" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
